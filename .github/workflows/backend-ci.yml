name: Backend CI

on:
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "infra/migrations/**"
      - "requirements*.txt"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - master
    paths:
      - "app/**"
      - "tests/**"
      - "infra/migrations/**"
      - "requirements*.txt"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app/orchestrator app/routers/orchestrator.py tests

      - name: Check formatting
        run: ruff format --check app/orchestrator app/routers/orchestrator.py tests

      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v
