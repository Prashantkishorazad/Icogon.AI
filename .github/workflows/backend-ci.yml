name: Backend CI

on:
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "infra/migrations/**"
      - "requirements*.txt"
      - "icogon-frontend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - master
    paths:
      - "app/**"
      - "tests/**"
      - "infra/migrations/**"
      - "requirements*.txt"
      - "icogon-frontend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: icogon-frontend/package-lock.json

      - name: Install preview compiler and frontend
        working-directory: icogon-frontend
        run: npm ci

      - name: Lint
        run: ruff check app/agents app/orchestrator app/sandbox app/routers/orchestrator.py tests

      - name: Check formatting
        run: ruff format --check app/agents app/orchestrator app/sandbox app/routers/orchestrator.py tests

      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v

      - name: Build frontend
        working-directory: icogon-frontend
        run: npm run build

      - name: Lint builder integration
        working-directory: icogon-frontend
        run: npx eslint src/pages/Builder/GeneratedPreview.tsx src/pages/Builder/BuilderWorkspacePage.tsx src/api/orchestratorApi.ts src/routes/PrivateRoute.tsx src/layouts/DashboardLayout.tsx
